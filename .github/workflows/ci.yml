name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l cmd internal)" ]; then
            echo "以下文件未格式化："
            gofmt -l cmd internal
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build (linux/windows/darwin)
        run: |
          mkdir -p dist
          for os in linux windows darwin; do
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            GOOS=$os GOARCH=amd64 go build -o "dist/miaosync-${os}-amd64${ext}" ./cmd/miaosync
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miaosync-builds
          path: dist/
