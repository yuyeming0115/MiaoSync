<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiaoSync 🐱 三端同步备份猫</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <!-- 左列：配置（节点 / 规则 / 操作），尽量紧凑 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">🐱</span>
        <div>
          <h1>MiaoSync</h1>
          <p class="ver">v0.1.0 · 本地优先 · 不上云</p>
        </div>
      </div>

      <section class="side-sec">
        <div class="side-head">节点 <button id="btnAddNode" class="mini" title="添加节点">＋ 添加</button></div>
        <div id="nodeList"></div>
        <div class="part-row">
          <span class="part-label">参与</span>
          <div id="participate" class="part"></div>
        </div>
      </section>

      <section class="side-sec rules">
        <div class="side-head">规则</div>
        <div class="rule-grid">
          <label>模式
            <select id="mode">
              <option value="mirror">mirror · 双向镜像</option>
              <option value="backup">backup · 单向备份</option>
            </select>
          </label>
          <label>冲突
            <select id="conflict">
              <option value="rename">rename · 旧版重命名备份</option>
              <option value="keep">keep · 两端各自保留</option>
              <option value="newer">newer · 仅留较新</option>
            </select>
          </label>
        </div>
        <details class="ignore-box">
          <summary>忽略规则（glob，每行一个）</summary>
          <textarea id="ignore" rows="3" placeholder=".DS_Store&#10;Thumbs.db&#10;node_modules"></textarea>
        </details>
      </section>

      <nav class="actions">
        <button id="btnPreview" class="btn">👁 预览对比</button>
        <button id="btnSync" class="btn btn-run">🚀 执行同步</button>
        <button id="btnSave" class="btn btn-ghost btn-sm">💾 保存配置</button>
      </nav>

      <div class="side-foot">
        <span id="connStatus" class="badge badge-ok">已连接</span>
        <button id="btnRefresh" class="mini" title="刷新节点状态">⟳</button>
      </div>
    </aside>

    <!-- 右列：文件对比（核心）+ 风险 + 迷你日志 -->
    <main class="main">
      <header class="main-head">
        <h2>📂 文件对比</h2>
        <div id="nodeBadges" class="node-badges"></div>
        <div id="cmpChips" class="chips"></div>
      </header>

      <div id="cfgBanner" class="cfg-banner" hidden></div>
      <div id="riskBanner" class="risk-banner" hidden></div>

      <section class="cmp-wrap">
        <div id="cmpFilters" class="cmp-filters" hidden>
          <button class="chip active" data-f="all">全部</button>
          <button class="chip" data-f="rename-conflict">🔺 冲突</button>
          <button class="chip" data-f="delete">🟠 删除</button>
          <button class="chip" data-f="copy">复制</button>
        </div>
        <div id="cmpTable" class="cmp">
          <p class="empty">① 插上硬盘 → ② 点「👁 预览对比」核对差异与风险 → ③ 无误后「🚀 执行同步」</p>
        </div>
      </section>

      <footer class="runbar">
        <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
        <div id="log" class="log" title="点击展开 / 收起"></div>
      </footer>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 同步完成报告 -->
  <div id="reportModal" class="report-modal" hidden>
    <div class="report-backdrop" data-close></div>
    <div class="report-card" role="dialog" aria-modal="true">
      <button class="report-close" data-close title="关闭">✕</button>
      <div id="reportHead" class="report-head"></div>

      <div class="report-body">
        <div class="report-chart">
          <svg id="reportDonut" viewBox="0 0 180 180" width="180" height="180" aria-hidden="true">
            <circle class="donut-track" cx="90" cy="90" r="68"></circle>
            <g id="reportSegments" transform="rotate(-90 90 90)"></g>
            <text id="reportCenter" x="90" y="84" class="donut-center-num" text-anchor="middle">0</text>
            <text x="90" y="106" class="donut-center-label" text-anchor="middle">总操作</text>
          </svg>
          <div id="reportLegend" class="report-legend"></div>
        </div>
        <div id="reportTiles" class="report-tiles"></div>
      </div>

      <section class="report-detail">
        <div class="detail-head">
          <span class="detail-title">📋 传输明细 <b id="detailCount">0</b></span>
          <div class="detail-filters" id="detailFilters">
            <button class="chip active" data-f="all">全部</button>
            <button class="chip" data-f="copy">复制</button>
            <button class="chip" data-f="delete">删除</button>
            <button class="chip" data-f="conflict">冲突</button>
          </div>
        </div>
        <div id="reportDetail" class="detail-list">
          <p class="x-empty">本次同步无文件传输。</p>
        </div>
      </section>

      <div id="reportBanner" class="report-banner" hidden></div>
      <div class="report-foot">
        <button class="btn btn-ghost" data-close>关闭</button>
        <button id="btnConfirmDanger" class="btn btn-run" hidden>⚠️ 确认并执行危险操作</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
