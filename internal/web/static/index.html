<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiaoSync 🐱 三端同步备份猫</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <!-- 左列：品牌 + 全局操作 + 状态 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">🐱</span>
        <div>
          <h1>MiaoSync</h1>
          <p class="tagline">Win / Mac / 移动硬盘<br/>三端同步备份猫</p>
        </div>
      </div>

      <nav class="actions">
        <button id="btnSave" class="btn btn-primary btn-block">💾 保存配置</button>
        <button id="btnPreview" class="btn btn-block">👁 预览同步</button>
        <button id="btnSync" class="btn btn-run btn-block">🚀 执行同步</button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-row">
          <span id="connStatus" class="badge badge-ok">已连接</span>
          <button id="btnRefresh" class="btn btn-ghost btn-sm" title="刷新状态">⟳ 刷新</button>
        </div>
        <p class="version">MVP · v0.1.0</p>
      </div>
    </aside>

    <!-- 右列：配置 + 预览 + 日志 -->
    <main class="main">
      <section class="card">
        <h2>🖥️ 同步节点</h2>
        <p class="hint">添加你的三端目录。同一节点可分别填 Windows 与 macOS 路径，程序会按当前系统自动选用。</p>
        <div id="nodeList" class="node-list"></div>
        <button id="btnAddNode" class="btn btn-ghost btn-block">＋ 添加节点</button>
      </section>

      <section class="card">
        <h2>⚙️ 同步设置</h2>
        <div class="settings-grid">
          <label class="field">
            <span>模式</span>
            <select id="mode">
              <option value="mirror">mirror · 双向同步（互为镜像）</option>
              <option value="backup">backup · 单向备份（仅源→目标）</option>
            </select>
          </label>
          <label class="field">
            <span>冲突策略</span>
            <select id="conflict">
              <option value="rename">rename · 保留较新，旧版重命名备份</option>
              <option value="keep">keep · 两端各自保留</option>
              <option value="newer">newer · 仅保留较新，删除旧版</option>
            </select>
          </label>
          <label class="field field-wide">
            <span>忽略规则（每行一个 glob）</span>
            <textarea id="ignore" rows="3" placeholder=".DS_Store&#10;Thumbs.db&#10;node_modules"></textarea>
          </label>
        </div>
        <div class="field">
          <span>参与本次同步的节点（至少 2 个）</span>
          <div id="participate" class="participate"></div>
        </div>
      </section>

      <div class="row-pair">
        <section class="card">
          <h2>📊 同步计划预览</h2>
          <div id="previewSummary" class="summary">
            <span class="stat stat-copy">复制 0</span>
            <span class="stat stat-del">删除 0</span>
            <span class="stat stat-conf">冲突 0</span>
          </div>
          <div id="previewList" class="action-list">
            <p class="empty">点击「预览同步」查看将执行的操作。</p>
          </div>
        </section>

        <section class="card">
          <h2>📜 执行日志</h2>
          <div class="progress-wrap">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <div id="log" class="log"></div>
        </section>
      </div>

      <section class="card card-compact">
        <h2>💡 节点状态</h2>
        <div id="statusList" class="status-list"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 同步完成报告 -->
  <div id="reportModal" class="report-modal" hidden>
    <div class="report-backdrop" data-close></div>
    <div class="report-card" role="dialog" aria-modal="true">
      <button class="report-close" data-close title="关闭">✕</button>
      <div id="reportHead" class="report-head"></div>

      <div class="report-body">
        <div class="report-chart">
          <svg id="reportDonut" viewBox="0 0 180 180" width="180" height="180" aria-hidden="true">
            <circle class="donut-track" cx="90" cy="90" r="68"></circle>
            <g id="reportSegments" transform="rotate(-90 90 90)"></g>
            <text id="reportCenter" x="90" y="84" class="donut-center-num" text-anchor="middle">0</text>
            <text x="90" y="106" class="donut-center-label" text-anchor="middle">总操作</text>
          </svg>
          <div id="reportLegend" class="report-legend"></div>
        </div>
        <div id="reportTiles" class="report-tiles"></div>
      </div>

      <section class="report-detail">
        <div class="detail-head">
          <span class="detail-title">📋 传输明细 <b id="detailCount">0</b></span>
          <div class="detail-filters" id="detailFilters">
            <button class="chip active" data-f="all">全部</button>
            <button class="chip" data-f="copy">复制</button>
            <button class="chip" data-f="delete">删除</button>
            <button class="chip" data-f="conflict">冲突</button>
          </div>
        </div>
        <div id="reportDetail" class="detail-list">
          <p class="x-empty">本次同步无文件传输。</p>
        </div>
      </section>

      <div id="reportBanner" class="report-banner" hidden></div>
      <div class="report-foot">
        <button class="btn btn-ghost" data-close>关闭</button>
        <button id="btnConfirmDanger" class="btn btn-run" hidden>⚠️ 确认并执行危险操作</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
